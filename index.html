<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a43"><title>SiteWatch | 自作サイト管理</title><link rel="stylesheet" href="style.css?v=100"><link rel="manifest" href="manifest.webmanifest?v=100"></head><body><a class="skip" href="#main">本文へ</a><header><div><p class="eyebrow">PERSONAL SITE OPERATIONS</p><h1>SiteWatch</h1><p>自作サイトの状態、版、更新予定をひとつにまとめる管理ダッシュボード</p></div><button id="addBtn" class="primary">＋ サイトを追加</button></header><main id="main"><section class="summary" aria-label="概要"><article><span>登録</span><strong id="totalCount">0</strong></article><article><span>正常</span><strong id="okCount">0</strong></article><article><span>要確認</span><strong id="warnCount">0</strong></article><article><span>未確認</span><strong id="uncheckedCount">0</strong></article></section><section class="toolbar"><label class="search">サイトを検索<input id="search" type="search" placeholder="名前・URL・メモ"></label><label>カテゴリー<select id="category"><option value="all">すべて</option></select></label><label>状態<select id="status"><option value="all">すべて</option><option value="ok">正常</option><option value="warning">要確認</option><option value="error">エラー</option><option value="unchecked">未確認</option></select></label><label>並び順<select id="sort"><option value="name">名前順</option><option value="updated">確認日時順</option><option value="priority">優先度順</option></select></label></section><section class="actions"><button id="checkAll">全サイトを手動確認</button><button id="exportBtn">JSONバックアップ</button><button id="importBtn">JSONから復元</button><input id="importFile" type="file" accept="application/json" hidden><button id="resetBtn" class="danger-ghost">初期データへ戻す</button></section><p id="message" role="status" aria-live="polite"></p><section class="section-head"><div><h2>サイト一覧</h2><p id="resultCount"></p></div><div class="legend"><span><i class="dot ok"></i>正常</span><span><i class="dot warning"></i>要確認</span><span><i class="dot error"></i>エラー</span><span><i class="dot unchecked"></i>未確認</span></div></section><section id="grid" class="grid"></section><p id="empty" class="empty" hidden>条件に合うサイトがありません。</p></main><dialog id="editor"><form id="form" method="dialog"><div class="dialog-head"><h2 id="dialogTitle">サイトを追加</h2><button type="button" id="closeDialog" aria-label="閉じる">×</button></div><input id="editId" type="hidden"><div class="form-grid"><label>サイト名<input id="name" required maxlength="80"></label><label>アイコン<input id="icon" maxlength="4" placeholder="🌐"></label><label class="wide">公開URL<input id="url" required type="url" placeholder="https://..."></label><label class="wide">GitHubリポジトリ<input id="repo" type="url" placeholder="https://github.com/..."></label><label>カテゴリー<input id="editCategory" required maxlength="40"></label><label>バージョン<input id="version" maxlength="30" placeholder="v1.0.0"></label><label>状態<select id="editStatus"><option value="unchecked">未確認</option><option value="ok">正常</option><option value="warning">要確認</option><option value="error">エラー</option></select></label><label>優先度<select id="priority"><option value="low">低</option><option value="normal">通常</option><option value="high">高</option></select></label><label class="wide">メモ<textarea id="notes" rows="4" maxlength="500"></textarea></label><fieldset class="wide"><legend>整備状況</legend><label><input id="pwa" type="checkbox">PWA対応</label><label><input id="readme" type="checkbox">README整備済み</label><label><input id="backup" type="checkbox">バックアップ済み</label></fieldset></div><div class="dialog-actions"><button type="button" id="deleteBtn" class="danger" hidden>削除</button><button type="button" id="cancelBtn">キャンセル</button><button type="submit" class="primary">保存</button></div></form></dialog><footer>SiteWatch v1.0.0 · データはこのブラウザ内だけに保存されます</footer><script src="app.js?v=100"></script></body></html>
